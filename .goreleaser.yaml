version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/jig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -X main.version={{.Version}}
    binary: jig

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: jig
    homepage: https://github.com/cliwright/jig
    description: "Render project templates — no hooks, no code execution, templates are data"
    repository:
      owner: cliwright
      name: homebrew-cliwright
    commit_author:
      name: Jesse Maitland
      email: jesse@cliwright.com

checksum:
  name_template: 'checksums.txt'

# SPDX SBOM per archive (syft). Installed by the release workflow.
sboms:
  - id: archives
    artifacts: archive

# Keyless cosign signature over the checksums: the signer identity is the
# release workflow's GitHub OIDC token, so there is no key to manage and
# the signature itself attests the CI provenance. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp 'https://github.com/cliwright/' \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle
      - ${signature}
      - --yes
      - ${artifact}
    artifacts: checksum
