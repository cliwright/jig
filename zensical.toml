[project]
site_name = "jig"
site_description = "Render project templates — no hooks, no code execution, templates are data"
site_url = "https://jig.cliwright.dev"
repo_url = "https://github.com/cliwright/jig"
repo_name = "cliwright/jig"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "CLI" = "cli.md" },
  { "Manifest" = "manifest.md" },
  { "Implementation" = "implementation.md" },
  { "Example Layouts" = "example_layouts.md" },
  { "ADRs" = "adr/index.md" },
]

[project.theme]
variant = "classic"
language = "en"
palette = { scheme = "whoiam" }
icon = { repo = "fontawesome/brands/git-alt" }
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.tabbed.alternate_style = true
