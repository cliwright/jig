[project]
site_name = "jig"
site_description = "Render project templates — no hooks, no code execution, templates are data"
site_url = "https://github.com/cliwright/jig"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
]

[project.theme]
language = "en"
palette = { scheme = "whoiam" }
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.tabbed.alternate_style = true
